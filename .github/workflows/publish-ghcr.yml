name: Publish GHCR
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['Dockerfile', 'railway/**', 'UPSTREAM_REF', '.github/workflows/publish-ghcr.yml']
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read upstream ref
        id: ref
        run: |
          echo "sha=$(sed -n 1p UPSTREAM_REF)" >> "$GITHUB_OUTPUT"
          echo "version=$(sed -n 2p UPSTREAM_REF)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: kgoedecke/doop
          ref: ${{ steps.ref.outputs.sha }}
          path: upstream
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build upstream Dockerfile, then the Railway wrapper
        run: |
          set -eux
          docker build -t doop-upstream:local upstream
          docker build -t ghcr.io/onepush-dev/doop:${{ steps.ref.outputs.version }} -t ghcr.io/onepush-dev/doop:latest .
          docker push ghcr.io/onepush-dev/doop:${{ steps.ref.outputs.version }}
          docker push ghcr.io/onepush-dev/doop:latest
